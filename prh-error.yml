# 用語辞書。textlint-rule-prh が読む。
#
# **手で直さない。** `words.md` の表から `build-prh.mjs` が作る。
# 語句を足すときは、あちらの表に 1 行足す。
version: 1
rules:

  # ===== 修正すべき語句 (見つけたら直す) =====
  # `container` の訳語。日本語では通じない
  - expected: コンテナ
    pattern: 容器
  # `smoke test` の直訳
  - expected: 経路の確認
    pattern: 煙試験
  # `walkthrough` の直訳
  - expected: 画面の確認
    pattern: 歩き回り
  # `forge` は日本では通じない
  - expected: Git ホスティング
    pattern: フォージ
  # 番をすること。機能の名前なら**ウォッチ**、検査が調べることなら**確かめる**
  - expected: ウォッチ / 確かめる
    pattern: 見張
  # 塗料や布の見本を綴じたもの。部品を実物の CSS で描いて並べたページは**カタログ**。道具の名前も `build_catalog.py` に揃えた
  - expected: カタログ
    pattern: 見本帳
  # DB の形を変えるほうは「マイグレーション」
  - expected: マイグレーション
    pattern: /移行(を適用|を当て|の適用|を流|ファイル)/
  # 同上
  - expected: マイグレーション
    pattern: /(適用済み|未適用|節目)の移行/
  # `配る` はブラウザへ送る意味で使っている
  - expected: リリース済みの
    pattern: /配った(移行|マイグレーション|版)/
  # 味方かを確かめる符号。パスワードでもトークンでもない
  - expected: パスワード / トークン
    pattern: 合言葉
  # 仲間内の隠語
  - expected: 認可コード
    pattern: 符丁
  # 知らせるしるし。トークンではない
  - expected: トークン
    pattern: /(知らない|そんな|使い切った)合図/
  # Unix のシグナルは「シグナル」
  - expected: 停止シグナル
    pattern: 停止の合図
  # 出入りする穴。HTTP の話ではない
  - expected: エンドポイント
    pattern: /(生死|監視|運用|利用者)の口/
  # 同上
  - expected: 受け側
    pattern: 受け口
  # しるし全般。接頭辞を指さない
  - expected: 試験の接頭辞
    pattern: 試験の印
  # 字の並べ方。識別子の文字列ではない
  - expected: 値
    pattern: /(知らない|読めない|間違えた)綴り/
  # 建物の基礎
  - expected: ベースイメージ / 前提のデータ
    pattern: 土台
  # 順に回すこと
  - expected: 持ち越す / 引き渡す
    pattern: 持ち回
  # 字の形 (glyph) のこと。書体の話でだけ使う
  - expected: アイコン
    pattern: 字形
  # 古風。`button` の訳語としては通らない
  - expected: ボタン
    pattern: 釦
  # 名札・付箋のこと。`badge` を指さない
  - expected: バッジ
    pattern: /(番号の|小さな|状態の)?札/
  # 体の脇のこと。`aside` の訳語としては通らない
  - expected: サイドバー / 横
    pattern: 脇
  # `flash` / `notification` は「通知」
  - expected: 通知
    pattern: /知らせ(?!る)/
  # 塗りの下ごしらえ。`background` ではない
  - expected: 背景
    pattern: 下地
  # 取るに足らないもの、の含み
  - expected: 補助要素
    pattern: 添え物
  # 計器の刻み。間隔の刻みは「スケール」
  - expected: スケール
    pattern: 目盛り
  # 的は標的。`target size` は「タップ領域」
  - expected: タップ領域
    pattern: 押す的
  # 古風
  - expected: ページ
    pattern: 頁
  # 漫画の吹き出し
  - expected: ツールチップ
    pattern: 吹き出し
  # `progress bar`
  - expected: プログレスバー
    pattern: 進捗の帯
  # `visually hidden`
  - expected: 視覚的に隠す
    pattern: 目から隠す
  # 名前を書いた札。DKIM の `selector` ではない
  - expected: セレクター
    pattern: 名札
  # 鍵をかけて戸締まりすること。アカウントの `lock` ではない
  - expected: ロック
    pattern: 施錠
  # 捕まえずに放すこと。`escape` を指さない
  - expected: エスケープ
    pattern: 逃が
  # 繋ぐやり方。表と表の `relation` を指さない
  - expected: リレーション
    pattern: 繋ぎ方
  # 容器。`container` を指さない
  - expected: コンテナ
    pattern: 入れ物
  # 食器・容れ物。要求ごとの保持領域を指さない（「解析器」「検出器」「評価器」は辞書にある語なので除く）
  - expected: コンテキスト
    pattern: /(?<![機容成査計析出価])器/
  # （無い語）
  - expected: エディタ
    pattern: 編集器
  # あだ名・通称。画面に出る `label` ではない
  - expected: 表示名
    pattern: 呼び名
  # 型紙。同じものを 2 つの語で呼ばない
  - expected: テンプレート
    pattern: 雛形
  # **全体の決まりとして書かない。** 元のプロジェクトでは、要件が画面側の処理を認めていたのに、この一文に従ったせいで、右クリックのメニューとガントチャートのドラッグを実装しなかった。「ここは `details` で足りる」のような**その場の説明は書いてよい**
  - expected: （書かない）
    pattern: /できることに(?:画面側の)?処理を書かない/
  # 建物の避難口。ログインの手段 (一度きりの URL など) を指さない
  - expected: 緊急用のログイン / 緊急時の手段
    pattern: 非常口
  # 料理の一覧。画面の `menu` を指さない
  - expected: メニュー / コンテキストメニュー
    pattern: 品書き
  # 「ルールベース」が定着している
  - expected: ルールベース
    pattern: 規則ベース
  # textlint の `rules` は「ルール」と呼ぶ（textlint の日本語の文書も「ルール」）
  - expected: $1ルール
    pattern: /((?:textlint|prh|lint|校正|チェック|書き方|語彙) ?の)規則/
  # 帯状の飾りのこと。画面の上下に並ぶ `toolbar` を指さない（1 文字の `帯` は「時間帯」「帯域」に一致するので、位置の語と組にした）
  - expected: 上部のバー / 下部のバー
    pattern: /[上下左右]の帯/
  # 名詞に勢いのある動詞を付けた言い方
  - expected: 特にハマりやすいのは
    pattern: 効く罠
  # 強調の定型
  - expected: これが
    pattern: これこそが
  # 推量の敬体。だ・である体に揃える
  - expected: と言える
    pattern: /と言え(よう|るでしょう)/
  # 大げさな抽象
  - expected: 実際に確認する
    pattern: /現実を見(る|ます|て)/
  # 教育評価の用語。日常語で言える
  - expected: チェックリスト
    pattern: ルーブリック
  # 言語学の用語。日常語で言える
  - expected: カタカナ語
    pattern: 借用語
  # 重言
  - expected: まず / 最初に
    pattern: まず最初に
  # 重言
  - expected: 最適
    pattern: 一番最適
  # 重言
  - expected: 現在
    pattern: 今現在
  # 重言。`ACL` の `L` が `List`
  - expected: ACL
    pattern: ACL リスト
  # 重言。`PIN` の `N` が `Number`
  - expected: PIN
    pattern: PIN 番号
  # 重言
  - expected: 既定値
    pattern: デフォルト既定値
  # 重言。過半数が既に半数を超えている
  - expected: 半数を超え / 過半数に達し
    pattern: 過半数を超え
  # 出典のない断定。将棋や囲碁の語
  - expected: 常道 / よくある構成
    pattern: 定石
  # 出典のない断定
  - expected: 本来の進め方
    pattern: 本筋
  # 出典のない断定。数えた根拠が無い
  - expected: よくある
    pattern: 最も一般的
  # 出典のない断定
  - expected: 採用例がある
    pattern: 実績が厚い
  # 出典のない断定
  - expected: 採用例がある
    pattern: 採用実績は多い
  # 出典のない断定
  - expected: よく出る
    pattern: 最頻出
  # 出典のない断定
  - expected: 基本の進め方
    pattern: 王道
  # 比喩名詞。内臓のこと（「肝心」「肝要」は当たらない）
  - expected: $1要点
    pattern: /(の|が)肝(?![心要])/
  # 比喩名詞
  - expected: 要点
    pattern: 勘所
  # 比喩名詞。野球や将棋の語
  - expected: 決め手
    pattern: 決定打
  # 比喩名詞
  - expected: 中核
    pattern: 心臓部
  # 比喩名詞
  - expected: 骨格 / 基盤
    pattern: 背骨
  # 比喩名詞
  - expected: の基盤
    pattern: の土台
  # 比喩名詞
  - expected: の中心
    pattern: /の核(?!心)/
  # 大げさな抽象
  - expected: が何か
    pattern: の正体
  # 大げさな抽象
  - expected: どれが正しいか
    pattern: 真実の所在
  # 日常語で言える。「アサインする」は「割り当てる」
  - expected: 割り当て
    pattern: アサイン
