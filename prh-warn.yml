# 用語辞書。textlint-rule-prh が読む。
#
# **手で直さない。** `words.md` の表から `build-prh.mjs` が作る。
# 語を足すときは、あちらの表に 1 行足す。
version: 1
rules:

  # ===== 気をつける語（warning を出すだけ。正しい使い方もある） =====
  # そのまま使ってよい意味: 物が下へ動く (「段落」は除く) / 紛れる意味: 該当しない / 失敗する / 下がる / 減る
  - expected: $1（該当しない / 失敗する / 下がる / 減る の意味で使っていないか確認）
    pattern: /((?<!段)落ち)/
    severity: warning
  # そのまま使ってよい意味: 物を下へ動かす (「段落と」に一致していたので「段落」は除く) / 紛れる意味: 除外する / 失敗させる / 下げる
  - expected: $1（除外する / 失敗させる / 下げる の意味で使っていないか確認）
    pattern: /((?<!段)落と)/
    severity: warning
  # そのまま使ってよい意味: 紐などを結ぶ / 紛れる意味: 連携する / 対応付ける / 接続する
  - expected: $1（連携する / 対応付ける / 接続する の意味で使っていないか確認）
    pattern: /(結び[付つ])/
    severity: warning
  # そのまま使ってよい意味: 人や物に付き従う / 紛れる意味: 追従する / 更新される
  - expected: $1（追従する / 更新される の意味で使っていないか確認）
    pattern: /(付いてい[かきくけこ])/
    severity: warning
  # そのまま使ってよい意味: もう一度手に取る / 紛れる意味: 取得し直す / 更新する
  - expected: 取り直（取得し直す / 更新する の意味で使っていないか確認）
    pattern: 取り直
    severity: warning
  # そのまま使ってよい意味: 人や物が行ったり来たりする / 紛れる意味: 往復する / リダイレクトする
  - expected: 行き来（往復する / リダイレクトする の意味で使っていないか確認）
    pattern: 行き来
    severity: warning
  # そのまま使ってよい意味: 人が記憶する / 紛れる意味: 保存する / 記録する
  - expected: 覚え（保存する / 記録する の意味で使っていないか確認）
    pattern: 覚え
    severity: warning
  # そのまま使ってよい意味: 人や物をどける / 紛れる意味: 一時的に移す / 退避する
  - expected: 退か（一時的に移す / 退避する の意味で使っていないか確認）
    pattern: 退か
    severity: warning
  # そのまま使ってよい意味: 書類の控え / 紛れる意味: 複製 / コピー
  - expected: 写し（複製 / コピー の意味で使っていないか確認）
    pattern: 写し
    severity: warning
  # そのまま使ってよい意味: 法令や組織の決まり / 紛れる意味: textlint などのルール
  - expected: 規則（textlint などのルール の意味で使っていないか確認）
    pattern: 規則
    severity: warning
  # そのまま使ってよい意味: 部品から作る / 紛れる意味: ビルド
  - expected: 組み立て（ビルド の意味で使っていないか確認）
    pattern: 組み立て
    severity: warning
  # そのまま使ってよい意味: 入学試験・資格試験など / 紛れる意味: テスト
  - expected: 試験（テスト の意味で使っていないか確認）
    pattern: 試験
    severity: warning
  # そのまま使ってよい意味: （紙や画面の）表 / 紛れる意味: テーブル
  - expected: $1（テーブル の意味で使っていないか確認）
    pattern: /((?:DB|データベース) ?の表)/
    severity: warning
  # そのまま使ってよい意味: 物を作ること（見出しだけの「作り」に当たる） / 紛れる意味: 構成
  - expected: $1（構成 の意味で使っていないか確認）
    pattern: /(^作り$)/
    severity: warning
  # そのまま使ってよい意味: （無い語） / 紛れる意味: 編集画面 / 入力欄
  - expected: $1（編集画面 / 入力欄 の意味で使っていないか確認）
    pattern: /(書く(?:画面|欄))/
    severity: warning
  # そのまま使ってよい意味: （無い語） / 紛れる意味: バージョン
  - expected: 版の印（バージョン の意味で使っていないか確認）
    pattern: 版の印
    severity: warning
  # そのまま使ってよい意味: 処理を途中で止める / 紛れる意味: 失敗扱いにする
  - expected: $1（失敗扱いにする の意味で使っていないか確認）
    pattern: /((?:チェック|検査)を止め)/
    severity: warning
  # そのまま使ってよい意味: 文の中の「こと」（句点で終わる文には当たらない） / 紛れる意味: 書き方: 見出しや箇条書きを「〜こと」で終えていないか確認。「確認した内容」などの名詞か、普通の文にする
  - expected: $1（見出しや箇条書きを「〜こと」で終えていないか確認。「確認した内容」などの名詞か、普通の文にする）
    pattern: /([^。]こと$)/
    severity: warning
  # そのまま使ってよい意味: 物がぶつかる / 紛れる意味: 該当する / 妥当だ / 推測が合う
  - expected: 当た（該当する / 妥当だ / 推測が合う の意味で使っていないか確認）
    pattern: 当た
    severity: warning
  # そのまま使ってよい意味: 物をぶつける (「割り当てる」は可) / 紛れる意味: 推測する / 該当させる / 規則を適用する
  - expected: 当て（推測する / 該当させる / 規則を適用する の意味で使っていないか確認）
    pattern: 当て
    severity: warning
  # そのまま使ってよい意味: 薬や力が作用する (「有効か」は可) / 紛れる意味: 重要だ / 有効だ / 適用される
  - expected: 効か（重要だ / 有効だ / 適用される の意味で使っていないか確認）
    pattern: 効か
    severity: warning
  # そのまま使ってよい意味: 薬や力が作用する / 紛れる意味: 重要だ / 有効だ / 適用される
  - expected: 効き（重要だ / 有効だ / 適用される の意味で使っていないか確認）
    pattern: 効き
    severity: warning
  # そのまま使ってよい意味: 薬や力が作用する / 紛れる意味: 重要だ / 有効だ / 適用される
  - expected: 効く（重要だ / 有効だ / 適用される の意味で使っていないか確認）
    pattern: 効く
    severity: warning
  # そのまま使ってよい意味: 薬や力が作用する / 紛れる意味: 重要だ / 有効だ / 適用される
  - expected: 効け（重要だ / 有効だ / 適用される の意味で使っていないか確認）
    pattern: 効け
    severity: warning
  # そのまま使ってよい意味: 薬や力が作用する / 紛れる意味: 重要だ / 有効だ / 適用される
  - expected: 効い（重要だ / 有効だ / 適用される の意味で使っていないか確認）
    pattern: 効い
    severity: warning
  # そのまま使ってよい意味: 物が刺さる / 紛れる意味: 説得力がある
  - expected: 刺さ（説得力がある の意味で使っていないか確認）
    pattern: 刺さ
    severity: warning
  # そのまま使ってよい意味: 物を詰める / 紛れる意味: 精査する / 仕上げる
  - expected: 詰め（精査する / 仕上げる の意味で使っていないか確認）
    pattern: 詰め
    severity: warning
  # そのまま使ってよい意味: 刃物で切る / 紛れる意味: 終える / 区切る / 下回る
  - expected: 切る（終える / 区切る / 下回る の意味で使っていないか確認）
    pattern: 切る
    severity: warning
  # そのまま使ってよい意味: 物を打つ / 紛れる意味: 実行する / 送る
  - expected: 打つ（実行する / 送る の意味で使っていないか確認）
    pattern: 打つ
    severity: warning
  # そのまま使ってよい意味: 物を回す / 紛れる意味: 実行する / 順に渡す
  - expected: 回す（実行する / 順に渡す の意味で使っていないか確認）
    pattern: 回す
    severity: warning
  # そのまま使ってよい意味: 物を通す / 紛れる意味: 検査に合格する / 適用する
  - expected: 通す（検査に合格する / 適用する の意味で使っていないか確認）
    pattern: 通す
    severity: warning
  # そのまま使ってよい意味: 引き抜く / 紛れる意味: 除外する / 取得する
  - expected: 抜く（除外する / 取得する の意味で使っていないか確認）
    pattern: 抜く
    severity: warning
  # そのまま使ってよい意味: 液体を流す / 紛れる意味: 実行する / 送信する
  - expected: 流す（実行する / 送信する の意味で使っていないか確認）
    pattern: 流す
    severity: warning
  # そのまま使ってよい意味: 物が掛かる / 紛れる意味: 時間を要する / 条件が付く
  - expected: 掛か（時間を要する / 条件が付く の意味で使っていないか確認）
    pattern: 掛か
    severity: warning
  # そのまま使ってよい意味: 物を掛ける / 紛れる意味: 条件を付ける
  - expected: 掛け（条件を付ける の意味で使っていないか確認）
    pattern: 掛け
    severity: warning
  # そのまま使ってよい意味: 手に取る / 紛れる意味: 取得する / 記録する
  - expected: 取る（取得する / 記録する の意味で使っていないか確認）
    pattern: 取る
    severity: warning
  # そのまま使ってよい意味: 物を叩く / 紛れる意味: 要求を送る (HTTP) / 呼ぶ (関数) / 問い合わせを送る (DB) / 直に指定する (URL の値)
  - expected: 叩（要求を送る (HTTP) / 呼ぶ (関数) / 問い合わせを送る (DB) / 直に指定する (URL の値) の意味で使っていないか確認）
    pattern: 叩
    severity: warning
  # そのまま使ってよい意味: 生物が生きる / 紛れる意味: 有効である
  - expected: 生き（有効である の意味で使っていないか確認）
    pattern: 生き
    severity: warning
  # そのまま使ってよい意味: 片付け / 紛れる意味: 検証 / 整理
  - expected: 掃除（検証 / 整理 の意味で使っていないか確認）
    pattern: 掃除
    severity: warning
  # そのまま使ってよい意味: 字の並べ方 / 紛れる意味: 値 / 名前
  - expected: 綴り（値 / 名前 の意味で使っていないか確認）
    pattern: 綴り
    severity: warning
  # そのまま使ってよい意味: 建物の基礎 / 紛れる意味: 前提データ
  - expected: 土台（前提データ の意味で使っていないか確認）
    pattern: 土台
    severity: warning
  # そのまま使ってよい意味: 物を挿し込む / 紛れる意味: プレースホルダ
  - expected: 差し込（プレースホルダ の意味で使っていないか確認）
    pattern: 差し込
    severity: warning
  # そのまま使ってよい意味: しまう / 紛れる意味: コミットする
  - expected: 収め（コミットする の意味で使っていないか確認）
    pattern: 収め
    severity: warning
  # そのまま使ってよい意味: 順に回す / 紛れる意味: 引き継ぐ / 渡す
  - expected: 持ち回（引き継ぐ / 渡す の意味で使っていないか確認）
    pattern: 持ち回
    severity: warning
  # そのまま使ってよい意味: 城の中心 / 紛れる意味: 中心的な問題
  - expected: 本丸（中心的な問題 の意味で使っていないか確認）
    pattern: 本丸
    severity: warning
  # そのまま使ってよい意味: 一回の打撃 / 紛れる意味: 決定的な反論
  - expected: 一撃（決定的な反論 の意味で使っていないか確認）
    pattern: 一撃
    severity: warning
  # そのまま使ってよい意味: 音楽の技法 / 紛れる意味: 共通する構造
  - expected: 通奏低音（共通する構造 の意味で使っていないか確認）
    pattern: 通奏低音
    severity: warning
  # そのまま使ってよい意味: 兵器 / 紛れる意味: 失敗しやすい点
  - expected: 地雷（失敗しやすい点 の意味で使っていないか確認）
    pattern: 地雷
    severity: warning
  # そのまま使ってよい意味: 筋肉・筋道 / 紛れる意味: 適切でない
  - expected: 筋が（適切でない の意味で使っていないか確認）
    pattern: 筋が
    severity: warning
  # そのまま使ってよい意味: （無い語） / 紛れる意味: 納得できる
  - expected: 腹落ち（納得できる の意味で使っていないか確認）
    pattern: 腹落ち
    severity: warning
  # そのまま使ってよい意味: 物を据える / 紛れる意味: 起点にする
  - expected: 据え（起点にする の意味で使っていないか確認）
    pattern: 据え
    severity: warning
  # そのまま使ってよい意味: 物が据わる / 紛れる意味: 不自然だ
  - expected: 据わ（不自然だ の意味で使っていないか確認）
    pattern: 据わ
    severity: warning
  # そのまま使ってよい意味: 会計 / 紛れる意味: 考慮する
  - expected: 勘定（考慮する の意味で使っていないか確認）
    pattern: 勘定
    severity: warning
  # そのまま使ってよい意味: 弾の届く距離 / 紛れる意味: 適用範囲
  - expected: 射程（適用範囲 の意味で使っていないか確認）
    pattern: 射程
    severity: warning
  # そのまま使ってよい意味: 車が走ること / 紛れる意味: 試験を流すこと
  - expected: 走行（試験を流すこと の意味で使っていないか確認）
    pattern: 走行
    severity: warning
  # そのまま使ってよい意味: 人の腕前 / 紛れる意味: スキル (Claude Code の)
  - expected: 技能（スキル (Claude Code の) の意味で使っていないか確認）
    pattern: 技能
    severity: warning
  # そのまま使ってよい意味: 比べること (「〜との対比」) / 紛れる意味: コントラスト比
  - expected: $1（コントラスト比 の意味で使っていないか確認）
    pattern: /((?<!相)対比)/
    severity: warning
  # そのまま使ってよい意味: 処理や手順の区切り (「2 段階」「段階的に」は当たらない) / 紛れる意味: ステータス
  - expected: $1（ステータス の意味で使っていないか確認）
    pattern: /((?<![0-9０-９])(?<![0-9０-９] )段階(?![0-9０-９的]))/
    severity: warning
