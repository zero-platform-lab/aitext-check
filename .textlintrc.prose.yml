# 書き方のルール。**文書にだけ使う。**
#
# 対象から外すファイルは `.textlintignore.prose` に書く。調査メモ、作業の記録、
# 表だけの一覧は、文章として書いていないので、このルールを使う意味がない
# （元のプロジェクトでは、410 件のうち 201 件がそこに出ていた）。
filters:
  comments: true
rules:
  preset-ja-technical-writing:
    # **`no-doubled-joshi` は無効にする。** 並列の「も…も」「と…と」を誤りとして
    # 数える。「ロールも権限も持たない」は正しい日本語で、文を分けると意味が変わる。
    # 文書だけに絞っても 136 件出ていた
    no-doubled-joshi: false

    # **warning にとどめる（チェックを失敗扱いにしない）。** コード片を含む文が長く
    # 数えられる。Markdown では `` ` `` がルールに渡る前に取り除かれるので、
    # `skipPatterns` に `` /`.*?`/ `` と書いても 1 件も除外されない（確かめた。200 字の
    # 識別子を書いた文が 207 字と数えられ、`/a+/` に変えると数えなくなる）。
    # 文書に残る 55 件のうち 48 件がこれだった
    sentence-length:
      max: 100
      severity: warning

    # 感嘆符と疑問符は使ってよい
    no-exclamation-question-mark: false

    # 漢語が続くのは、日本語として普通である（「権限管理画面」）
    max-kanji-continuous-len: false

    # **無効にする。** 指摘された 3 件はすべて、である調の地の文に画面の文言を
    # 引用した箇所だった（「ログイン名またはパスワードが違います」を返す）。
    # このルールは、引用と地の文を区別できない
    no-mix-dearu-desumasu: false

    # **無効にする。** 「思う」「かも」を書き手のあいまいな表現として数えるが、
    # 指摘された 4 件はすべて、**利用者が何を思うかを書いた**箇所だった
    # （「黙って捨てると、利用者は保存できたと思う」）
    ja-no-weak-phrase: false

    # **無効にする。** 括弧の対応を 1 つの文の中だけで確かめる。`(` と `)` を
    # 別の行に書いた文書で、指摘された 1 件は誤検出だった
    no-unmatched-pair: false

    # **無効にする。** 「何十回」を「10 回」に直すよう指摘するが、具体的に数えられる数ではない
    arabic-kanji-numbers: false

    # 文末の句点。**このルールは残す。** 元のプロジェクトで、ある文書の最終行が
    # `確定した仕様ではない。---` になっていて、水平線が文字として
    # 表示されていた不具合を、このルールが見つけた。
    #
    # 「:」と「、」で終わる行は文末ではない。次の行に箇条書きかコードが続く
    # （「そのかわり、」で行を終え、次の行から箇条書きにする書き方をする）
    ja-no-mixed-period:
      allowPeriodMarks:
        - ":"
        - "："
        - "、"
