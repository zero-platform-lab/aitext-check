# 書き方の規則。**文書だけに当てる。**
#
# 対象から外す file は `.textlintignore.prose` にある。調査メモ・記録・
# 表の一覧は、文章として書いていないので当てる意味が無い
# (410 件のうち 201 件がそこに出ていた)。
filters:
  comments: true
rules:
  preset-ja-technical-writing:
    # **`no-doubled-joshi` は外す。** 並列の「も…も」「と…と」を誤りとして
    # 数える。「ロールも権限も持たない」は正しい日本語で、分割すると意味が変わる。
    # 文書だけに絞っても 136 件出ていた
    no-doubled-joshi: false

    # **止めない。** コード片を含む文が長く数えられる。Markdown では
    # `` ` `` が規則に渡る前に取り除かれるので、`skipPatterns` に
    # `` /`.*?`/ `` と書いても 1 件も外れない (確かめた。200 字の識別子を
    # 書いた文が 207 字と数えられ、`/a+/` に変えると数えなくなる)。
    # 文書に残る 55 件のうち 48 件がこれ
    sentence-length:
      max: 100
      severity: warning

    # 感嘆符と疑問符は使ってよい
    no-exclamation-question-mark: false

    # 漢語が続くのは日本語として普通 (「権限管理画面」)
    max-kanji-continuous-len: false

    # **外す。** 当たった 3 件は全部、である調の地の文に画面の文言を
    # 引用した箇所だった (「ログイン名またはパスワードが違います」を返す)。
    # 引用と地の文を区別できない
    no-mix-dearu-desumasu: false

    # **外す。** 「思う」「かも」を書き手のぼかしとして数えるが、
    # 当たった 4 件は全部、**利用者が何を思うかを書いた**箇所だった
    # (「黙って捨てると、利用者は保存できたと思う」)
    ja-no-weak-phrase: false

    # **外す。** 括弧の対応を文の内側だけで数える。この文書は `(` を書いた行と
    # `)` を書いた行が別なので、当たった 1 件は誤検出だった
    no-unmatched-pair: false

    # **外す。** 「何十回」を「10 回」に直せと言う。数えられる数ではない
    arabic-kanji-numbers: false

    # 文末の句点。**この規則は残す。** `docs/requirements.md` の最終行が
    # `確定した仕様ではない。---` になっていて、水平線が文字として
    # 描かれていた不具合を、これが見つけた。
    #
    # 「:」と「、」で終わる行は文末ではない。続きが箇条書きかコードになる
    # (「そのかわり、」で切って、次の行から箇条書きにする書き方をする)
    ja-no-mixed-period:
      allowPeriodMarks:
        - ":"
        - "："
        - "、"
