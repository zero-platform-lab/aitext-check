# 既定の設定。**語彙だけをチェックする。**
#
# **対象は、リポジトリの日本語すべて。** 文書も、訳語の表も、コードのコメントも
# チェックする。調査メモや作業の記録にも、使わない語は書かないでほしいので、
# この設定だけは対象を絞らない。外すファイルは `.textlintignore` に書く。
#
# 書き方のルール（文の長さ、助詞、句点）は `.textlintrc.prose.yml` にある。
# **そちらは文書にだけ使う。** 表だけの一覧や作業の記録に使っても、直しようがない。
#
# **コードの中の日本語もチェックする。** textlint はファイルの拡張子でパーサーを
# 選ぶので、`.rs` や `.py` は既定ではチェックしない。ここでプレーンテキストとして
# 読み込ませる。
#
# **コード自体は ASCII なので、辞書の語に一致しない。** 一致するのは、コメントと
# 文字列の中の日本語だけである。日本語の部分を取り出す必要はない。行と列も元の
# ファイルのままなので、指摘された位置をそのまま開ける。
#
# `.md` はここに含めない。Markdown として読み込むほうが、表や引用を正しく扱える。
plugins:
  "@textlint/text":
    extensions:
      - .rs
      - .py
      - .sh
      - .sql
      - .html
      - .js
      - .css
      - .toml
      - .yml
      - .yaml
      - .conf
      - .service
      - .example
      - .Dockerfile
      - .json

# **`<!-- textlint-disable -->` は Markdown でしか使えない。** 構文木を見て動くので、
# プレーンテキストとして読み込むファイルでは無視される。外すなら `.textlintignore` に書く。
filters:
  comments: true
rules:
  # `build-prh.mjs` が `words.md` から作る。**手で直さない。**
  prh:
    rulePaths:
      - ./prh-error.yml
