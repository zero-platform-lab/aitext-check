# 既定の設定。**語彙だけを見る。**
#
# **対象はリポジトリの日本語ぜんぶ。** 文書も、訳の表も、コードの
# コメントも読む。調査メモにも記録にも使わない語は書いてほしくないので、
# ここだけは絞らない。外す file は `.textlintignore`。
#
# 書き方の規則 (文の長さ・助詞・句点) は `.textlintrc.prose.yml` にある。
# **あちらは文書だけに当てる。** 表の一覧や記録に当てても直しようがない。
#
# **コードの中の日本語も読む。** textlint は拡張子で構文解析器を選ぶので、
# `.rs` や `.py` は既定では読み飛ばす。素のテキストとして読ませる。
#
# **コードそのものは ASCII なので、辞書に当たらない。** 当たるのは
# コメントと文字列の中の日本語だけである。切り出す必要は無い。
# 行も桁も元の file のままなので、出た位置をそのまま開ける。
#
# `.md` はここに入れない。Markdown として読むほうが、表や引用を正しく扱える。
plugins:
  "@textlint/text":
    extensions:
      - .rs
      - .py
      - .sh
      - .sql
      - .html
      - .js
      - .css
      - .toml
      - .yml
      - .yaml
      - .conf
      - .service
      - .example
      - .Dockerfile
      - .json

# **`<!-- textlint-disable -->` は Markdown でしか効かない。** 構文木を見て
# 動くので、素のテキストで読む file では素通りする。外すなら `.textlintignore`。
filters:
  comments: true
rules:
  # `tools/build_prh.py` が `docs/words.md` から作る。**手で直さない。**
  prh:
    rulePaths:
      - ./prh-error.yml
